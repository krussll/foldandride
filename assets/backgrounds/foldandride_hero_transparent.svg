  <!-- Map pin (subtle, right side) -->
  <path class="line" d="M1410,300 C1410,240 1460,200 1510,200 C1560,200 1610,240 1610,300 C1610,372 1510,450 1510,450 C1510,450 1410,372 1410,300 Z"/>
